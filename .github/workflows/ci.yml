name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

# A newer push makes an in-flight run for the same ref irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # package.json engines requires >=22.12.0; 22.x resolves to the latest LTS
  # patch, which also satisfies astro-eslint-parser's ^22.22.3 requirement.
  NODE_VERSION: '22'

jobs:
  # Fast deterministic gate: typecheck, lint, format:check, build.
  validate:
    name: Fast validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run validate

  # Expensive browser gates. Only worth running once fast validation is green.
  browser:
    name: Browser quality
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run test:security
      - run: npm run check:links

  # Runs in parallel with `browser`: both are expensive and independent.
  # Lighthouse reuses the Playwright Chromium via lighthouserc.cjs.
  performance:
    name: Performance budgets
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:perf

  # Independent of the application gates, so it starts immediately.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    # Gitleaks lists the PR's commits through the API, which needs read access
    # to pull requests. Granted per job so the rest stays contents-read only.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks needs full history to scan past commits.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Blocking: nothing shipped to users may carry a high/critical advisory.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      # Blocking: a critical advisory anywhere, including dev tooling.
      - name: Audit full tree for critical (blocking)
        run: npm audit --audit-level=critical

      # Informational: keeps known dev-only HIGH/MODERATE findings visible
      # without making CI unusable. See README "Supply chain policy".
      - name: Audit full tree (informational)
        continue-on-error: true
        run: npm audit

      # Third-party action pinned to a full commit SHA rather than a tag.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
